[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-va"
version = "0.2.0"
description = "Polymer - adaptive asset-centric security assessment orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Polymer Project"}]
dependencies = [
  "typer>=0.12,<1", "rich>=13,<15", "pydantic>=2.7,<3", "PyYAML>=6,<7",
  "requests>=2.32,<3", "jinja2>=3.1,<4", "python-gvm>=26,<27", "lxml>=5,<7"
]

[project.scripts]
polymer = "polymer.cli:app"

[tool.setuptools.packages.find]
include = ["polymer*"]
